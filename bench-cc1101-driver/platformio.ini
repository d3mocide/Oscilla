; bench-cc1101-driver — runs Oscilla's own CC1101 layers (firmware-c5/main/cc1101_*.c)
; on a spare XIAO ESP32-S3 for the D-15 A/B against the SmartRC reference.
; Receive-only; see README.md.

[env:xiao-s3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../firmware-c5/main
    -Wall
