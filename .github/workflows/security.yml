name: Oscilla security gates

on:
  # Branch pushes to main and release tags (v*, cut on main per
  # docs/RELEASING.md). Other branches and archive/* tags do not run.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  host-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The frame-memory check compiles the real external views on the host
      # and needs M5GFX's font headers. Fetch only that library (pinned in
      # platformio.ini), not the whole deck toolchain.
      - name: Fetch pinned M5GFX headers
        run: |
          python -m venv "$RUNNER_TEMP/platformio-venv"
          "$RUNNER_TEMP/platformio-venv/bin/python" -m pip install platformio==6.2.0
          "$RUNNER_TEMP/platformio-venv/bin/pio" pkg install -d firmware-cardputer \
            -e cardputer-adv --no-save -l m5stack/M5GFX@0.2.28
      - name: Run protocol, receive-only, sanitizer, parser, and export gates
        run: ASAN_OPTIONS=detect_leaks=0 ./tools/check_protocol.sh

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PlatformIO Core
        run: |
          python -m venv "$RUNNER_TEMP/platformio-venv"
          "$RUNNER_TEMP/platformio-venv/bin/python" -m pip install platformio==6.2.0
      - name: Install pinned ESP-IDF
        run: |
          mkdir -p "$HOME/esp"
          git clone --depth 1 --branch v5.5.6 --recurse-submodules \
            https://github.com/espressif/esp-idf.git "$HOME/esp/esp-idf"
          "$HOME/esp/esp-idf/install.sh" esp32c5
      - name: Add pinned PlatformIO to PATH
        run: |
          echo "$RUNNER_TEMP/platformio-venv/bin" >> "$GITHUB_PATH"
          echo "OSCILLA_PIO_BIN=$RUNNER_TEMP/platformio-venv/bin" >> "$GITHUB_ENV"
      - name: Build C5 UART and deck
        run: ./tools/build_firmware.sh
      - name: Build C5 USB bench variant (probe only)
        run: ./tools/build_firmware.sh --bench --probe-only
