name: Oscilla security gates

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  host-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run protocol, receive-only, sanitizer, parser, and export gates
        run: ASAN_OPTIONS=detect_leaks=0 ./tools/check_protocol.sh

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.2.0
      - name: Install pinned ESP-IDF
        run: |
          mkdir -p "$HOME/esp"
          git clone --depth 1 --branch v5.5.1 --recurse-submodules \
            https://github.com/espressif/esp-idf.git "$HOME/esp/esp-idf"
          "$HOME/esp/esp-idf/install.sh" esp32c5
      - name: Build C5 UART and deck
        run: ./tools/build_firmware.sh
      - name: Build C5 USB bench variant and deck
        run: ./tools/build_firmware.sh --bench
