; oscilla-cp — the deck. PlatformIO / Arduino-ESP32.
;
; D-12 (BLOCKING, docs/DECISIONS.md): Cardputer ADV support in M5Unified/M5GFX
; is unverified. The ADV differs from the original Cardputer in keyboard matrix
; and EXT header. `board` below is the original Cardputer's StampS3 and is a
; placeholder until D-12 is resolved — confirm before P1.
;
;   pio run          build
;   pio run -t upload

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    ; The OCP contract, shared byte-for-byte with the probe firmware.
    -I$PROJECT_DIR/../protocol
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3

build_unflags =
    -std=gnu++11
build_flags_cxx = -std=gnu++17

; lib_deps intentionally empty until D-12 is settled. P1 adds:
;   m5stack/M5Unified
; lib_deps =
;     m5stack/M5Unified@^0.2.2
