; oscilla-cp — the deck. PlatformIO / Arduino-ESP32.
;
; StampS3 board def is correct for the ADV: M5Unified autodetects it at runtime
; (D-12, verified on hardware).

[env:cardputer-adv]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    ; The OCP contract, shared with the probe.
    -I$PROJECT_DIR/../protocol
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
    ; The board sets USB_MODE=1 but not this, so Serial would be UART0's pins
    ; instead of the USB port.
    -DARDUINO_USB_CDC_ON_BOOT=1

build_unflags =
    -std=gnu++11
; version.py defines OSCILLA_DECK_VER from ../VERSION (docs/RELEASING.md).
extra_scripts = pre:cxx17.py
    pre:version.py

; The contract's shared C sources are built into the deck app.
build_src_filter = +<*> +<../../protocol/ocp_text.c>

; Exact pins: these versions are the ones verified on the ADV (D-12).
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    m5stack/M5Cardputer@1.1.1

; GMT028-05/ST7789 is the normal deck's only external display.
[env:cardputer-adv-st7789]
extends = env:cardputer-adv

; Standalone native-driver reference. Remove SD before running.
[env:tft-cs-check]
extends = env:cardputer-adv
build_src_filter = -<*> +<../bench/tft_cs_check.cpp>

; Bench: USB <-> Grove passthrough for driving the probe from host tools.
;   pio run -e grove-bridge -t upload --upload-port /dev/serial/by-id/...
[env:grove-bridge]
extends = env:cardputer-adv
build_src_filter = -<*> +<../bench/grove_bridge.cpp>

; Bench: D-12 check — board detect, display, keyboard, Grove relay under M5Unified.
[env:adv-check]
extends = env:cardputer-adv
build_src_filter = -<*> +<../bench/adv_check.cpp>

; SD test arms only on ENTER; external display CLK/MOSI must be disconnected.
[env:sd-check]
extends = env:cardputer-adv
build_flags = ${env:cardputer-adv.build_flags} -I$PROJECT_DIR/src
build_src_filter = -<*> +<../bench/sd_check.cpp> +<storage/sd_storage.cpp>

; Experimental coexistence: SD and external redraws alternate under one lock.
[env:sd-display-check]
extends = env:cardputer-adv
build_flags = ${env:cardputer-adv.build_flags} -I$PROJECT_DIR/src -DOSCILLA_SD_DISPLAY_BENCH -DOSCILLA_EXTERNAL_TFT_HZ=8000000
build_src_filter = -<*> +<../bench/sd_display_check.cpp> +<storage/sd_storage.cpp> +<gnss/nmea_parser.cpp> +<ui/observatory_fonts.cpp> +<ui/external_gps_display.cpp> +<ui/external_tft.cpp> +<ui/external_gnss_view.cpp> +<ui/external_card_views.cpp> +<ui/external_wifi_view.cpp> +<ui/external_spectrum_view.cpp> +<ui/external_lora_view.cpp> +<ui/external_drive_view.cpp> +<ui/external_bt_view.cpp> +<ui/external_contacts_view.cpp> +<ui/external_zig_view.cpp> +<ui/external_ook_view.cpp> +<model/ook_model.cpp> +<ui/external_system_view.cpp> +<model/gnss_model.cpp> +<model/deauth_model.cpp> +<model/anti_surveillance_model.cpp> +<model/lora_framing.cpp> +<model/spectrum_model.cpp> +<ocp/ocp_parser.cpp> +<ocp/ocp_csv.cpp> +<../../protocol/ocp_text.c>

; Compatibility name for the ST7789 disposable-file fixture.
[env:sd-st7789-check]
extends = env:sd-display-check
