; oscilla-cp — the deck. PlatformIO / Arduino-ESP32.
;
; StampS3 board def is correct for the ADV: M5Unified autodetects it at runtime
; (D-12, verified on hardware).

[env:cardputer-adv]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    ; The OCP contract, shared with the probe.
    -I$PROJECT_DIR/../protocol
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
    ; No OCP verb reports the deck's own version (it's a client, not a
    ; server); shown in the Info view's DECK section instead.
    -DOSCILLA_DECK_VER=\"0.2.0\"
    ; The board sets USB_MODE=1 but not this, so Serial would be UART0's pins
    ; instead of the USB port.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Delivered no-CS ILI9341: 8 MHz SD cap plus corner-pixel parking.
    -DOSCILLA_EXTERNAL_NO_CS_DISPLAY

build_unflags =
    -std=gnu++11
extra_scripts = pre:cxx17.py

; The contract's shared C sources are built into the deck app.
build_src_filter = +<*> +<../../protocol/ocp_text.c>

; Exact pins: these versions are the ones verified on the ADV (D-12).
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    m5stack/M5Cardputer@1.1.1

; Bench: USB <-> Grove passthrough for driving the probe from host tools.
;   pio run -e grove-bridge -t upload --upload-port /dev/serial/by-id/...
[env:grove-bridge]
extends = env:cardputer-adv
build_src_filter = -<*> +<../bench/grove_bridge.cpp>

; Bench: D-12 check — board detect, display, keyboard, Grove relay under M5Unified.
[env:adv-check]
extends = env:cardputer-adv
build_src_filter = -<*> +<../bench/adv_check.cpp>

; Isolated display only: SD physically removed, CS assumed tied active on panel.
[env:tft-no-cs]
extends = env:cardputer-adv
build_flags = ${env:cardputer-adv.build_flags} -I$PROJECT_DIR/src
build_src_filter = -<*> +<../bench/tft_no_cs.cpp> +<gnss/nmea_parser.cpp> +<model/gnss_model.cpp>

; Normal deck UI plus external GPS. SD must remain physically removed.
[env:dual-display-no-cs]
extends = env:cardputer-adv
build_flags = ${env:cardputer-adv.build_flags} -DOSCILLA_NO_CS_DISPLAY_BENCH

; SD test arms only on ENTER; external display CLK/MOSI must be disconnected.
[env:sd-check]
extends = env:cardputer-adv
build_flags = ${env:cardputer-adv.build_flags} -I$PROJECT_DIR/src
build_src_filter = -<*> +<../bench/sd_check.cpp> +<storage/sd_storage.cpp>

; Experimental coexistence: SD and external redraws alternate under one lock.
[env:sd-display-check]
extends = env:cardputer-adv
build_flags = ${env:cardputer-adv.build_flags} -I$PROJECT_DIR/src -DOSCILLA_SD_DISPLAY_BENCH
build_src_filter = -<*> +<../bench/sd_display_check.cpp> +<storage/sd_storage.cpp> +<gnss/nmea_parser.cpp> +<ui/external_gps_display.cpp> +<ui/external_spectrum_view.cpp> +<ui/external_lora_view.cpp> +<ui/external_drive_view.cpp> +<ui/external_bt_view.cpp> +<ui/external_contacts_view.cpp> +<ui/external_zig_view.cpp> +<ui/external_system_view.cpp> +<model/gnss_model.cpp> +<model/lora_framing.cpp>
