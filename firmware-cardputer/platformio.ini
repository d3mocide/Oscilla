; oscilla-cp — the deck. PlatformIO / Arduino-ESP32.
;
; `board` is a placeholder: Cardputer ADV support is unverified (D-12, blocking).

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    ; The OCP contract, shared with the probe.
    -I$PROJECT_DIR/../protocol
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
    ; The board sets USB_MODE=1 but not this, so Serial would be UART0's pins
    ; instead of the USB port.
    -DARDUINO_USB_CDC_ON_BOOT=1

build_unflags =
    -std=gnu++11
build_flags_cxx = -std=gnu++17

; Empty until D-12 is settled; P1 adds M5Unified.
; lib_deps =
;     m5stack/M5Unified@^0.2.2

; Bench: USB <-> Grove passthrough for driving the probe from host tools.
;   pio run -e grove-bridge -t upload --upload-port /dev/serial/by-id/...
[env:grove-bridge]
extends = env:cardputer-adv
build_src_filter = -<*> +<../bench/grove_bridge.cpp>
