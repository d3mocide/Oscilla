; bench-power-meter — P6 current meter on a XIAO ESP32-S3. Bench
; instrumentation, not Oscilla firmware. See README.md.
;
;   pio run -t upload --upload-port /dev/serial/by-id/<the XIAO S3>

[env:xiao-s3]
platform = espressif32@7.0.1
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

build_flags =
    ; Only for OCP_BAUD_DEFAULT; the meter never parses OCP.
    -I$PROJECT_DIR/../protocol
    -Wall
    -Wextra

; Same C++17 selection as the deck (firmware-cardputer/cxx17.py).
build_unflags =
    -std=gnu++11
extra_scripts = pre:../firmware-cardputer/cxx17.py
