<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Oscilla C5 dual-radio wiring diagram</title>
  <desc id="desc">Exact build reference for a XIAO ESP32-C5 sharing an SPI bus with a Wio-SX1262 and CC1101, including independent chip selects, Wio control signals, required pull resistors, local decoupling capacitors, common 3.3 volt power and ground, open CC1101 GDO pins, and separate 915 megahertz antennas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1220"/><stop offset="1" stop-color="#101c2d"/>
    </linearGradient>
    <linearGradient id="c5fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17395b"/><stop offset="1" stop-color="#112b47"/>
    </linearGradient>
    <linearGradient id="wiofill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282d55"/><stop offset="1" stop-color="#1d2444"/>
    </linearGradient>
    <linearGradient id="ccfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#49361c"/><stop offset="1" stop-color="#332819"/>
    </linearGradient>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#eef6ff} .title{font-size:42px;font-weight:800;letter-spacing:1px}.sub{font-size:21px;fill:#b8cae1}.head{font-size:31px;font-weight:800}.role{font-size:18px;fill:#b8cae1}.pin{font-size:20px;font-weight:650}.small{font-size:16px;fill:#bfd0e6}.tiny{font-size:14px;fill:#aebfd4}.net{font-size:15px;font-weight:800;letter-spacing:.5px}.value{font-size:15px;font-weight:700}.wire{fill:none;stroke:#78c7ff;stroke-width:4;stroke-linecap:round}.wioWire{fill:none;stroke:#b397ff;stroke-width:4;stroke-linecap:round}.ccWire{fill:none;stroke:#f2ba55;stroke-width:4;stroke-linecap:round}.miso{fill:none;stroke:#eef6ff;stroke-width:4;stroke-linecap:round}.power{fill:none;stroke:#55e1a4;stroke-width:5;stroke-linecap:round}.gnd{fill:none;stroke:#63dcb0;stroke-width:5;stroke-linecap:round}.node{stroke:none}.box{stroke-width:3}.passive{fill:#0e1827;stroke-width:2}.res{fill:#121d2d;stroke:#eef6ff;stroke-width:3}.cap{stroke:#eef6ff;stroke-width:3}.nc{stroke:#b7c6d9;stroke-width:3;stroke-dasharray:7 7}.labelBox{fill:#0d1827;stroke-width:2}.warn{font-size:20px;font-weight:800;letter-spacing:.5px}.foot{font-size:15px;fill:#b5c7dc}
    </style>
  </defs>

  <rect width="1800" height="1320" fill="url(#bg)"/>
  <text id="title" class="title" x="55" y="62">OSCILLA · C5 DUAL-RADIO WIRING</text>
  <text class="sub" x="57" y="98">Receive-only prototype · shared SPI · independent chip selects · exact harness passives</text>
  <rect x="1368" y="40" width="375" height="54" rx="12" fill="#123328" stroke="#55e1a4" stroke-width="2"/>
  <text x="1556" y="74" text-anchor="middle" font-size="18" font-weight="700" fill="#91f1c5">3.3 V LOGIC + MODULE POWER ONLY</text>

  <!-- global rails -->
  <text class="head" x="58" y="157" fill="#55e1a4">3V3</text>
  <path class="power" d="M125 148H1742"/>
  <circle class="node" cx="250" cy="148" r="7" fill="#55e1a4"/><path class="power" d="M250 148V205"/>
  <circle class="node" cx="900" cy="148" r="7" fill="#55e1a4"/><path class="power" d="M900 148V205"/>
  <circle class="node" cx="1550" cy="148" r="7" fill="#55e1a4"/><path class="power" d="M1550 148V205"/>

  <!-- radio/controller cards -->
  <rect class="box" x="58" y="205" width="502" height="625" rx="24" fill="url(#wiofill)" stroke="#b397ff"/>
  <rect class="box" x="649" y="205" width="502" height="625" rx="24" fill="url(#c5fill)" stroke="#78c7ff"/>
  <rect class="box" x="1240" y="205" width="502" height="625" rx="24" fill="url(#ccfill)" stroke="#f2ba55"/>

  <text class="head" x="309" y="249" text-anchor="middle">Wio-SX1262</text>
  <text class="role" x="309" y="278" text-anchor="middle">LoRa RX · 862–930 MHz</text>
  <text class="head" x="900" y="249" text-anchor="middle">XIAO ESP32-C5</text>
  <text class="role" x="900" y="278" text-anchor="middle">shared SPI controller + radio arbiter</text>
  <text class="head" x="1491" y="249" text-anchor="middle">CC1101</text>
  <text class="role" x="1491" y="278" text-anchor="middle">Legacy OOK / FSK / GFSK RX</text>

  <!-- power endpoints -->
  <circle cx="250" cy="205" r="7" fill="#55e1a4"/><text class="net" x="269" y="223" fill="#7cebbd">3V3</text>
  <circle cx="900" cy="205" r="7" fill="#55e1a4"/><text class="net" x="920" y="223" fill="#7cebbd">3V3</text>
  <circle cx="1550" cy="205" r="7" fill="#55e1a4"/><text class="net" x="1570" y="223" fill="#7cebbd">VCC / 3V3</text>

  <!-- shared SPI -->
  <text class="pin" x="516" y="337" text-anchor="end">SCK</text><circle cx="560" cy="330" r="7" fill="#78c7ff"/>
  <path class="wire" d="M560 330H649"/><circle cx="649" cy="330" r="7" fill="#78c7ff"/>
  <text class="pin" x="687" y="337">D8 / GPIO8</text><text class="small" x="1110" y="337" text-anchor="end">SCK</text>
  <circle cx="1151" cy="330" r="7" fill="#78c7ff"/><path class="wire" d="M1151 330H1240"/><circle cx="1240" cy="330" r="7" fill="#78c7ff"/>
  <text class="pin" x="1284" y="337">SCK</text>

  <text class="pin" x="516" y="387" text-anchor="end">MOSI</text><circle cx="560" cy="380" r="7" fill="#78c7ff"/>
  <path class="wire" d="M560 380H649"/><circle cx="649" cy="380" r="7" fill="#78c7ff"/>
  <text class="pin" x="687" y="387">D10 / GPIO10</text><text class="small" x="1110" y="387" text-anchor="end">MOSI</text>
  <circle cx="1151" cy="380" r="7" fill="#78c7ff"/><path class="wire" d="M1151 380H1240"/><circle cx="1240" cy="380" r="7" fill="#78c7ff"/>
  <text class="pin" x="1284" y="387">SI / MOSI</text>

  <text class="pin" x="516" y="437" text-anchor="end">MISO</text><circle cx="560" cy="430" r="7" fill="#eef6ff"/>
  <path class="miso" d="M560 430H649"/><circle cx="649" cy="430" r="7" fill="#eef6ff"/>
  <text class="pin" x="687" y="437">D9 / GPIO9</text><text class="small" x="1110" y="437" text-anchor="end">MISO</text>
  <circle cx="1151" cy="430" r="7" fill="#eef6ff"/><path class="miso" d="M1151 430H1240"/><circle cx="1240" cy="430" r="7" fill="#eef6ff"/>
  <text class="pin" x="1284" y="437">SO / MISO</text>
  <rect x="742" y="452" width="316" height="34" rx="8" fill="#0c1a2a" stroke="#6b829c"/>
  <text class="tiny" x="900" y="474" text-anchor="middle">DESELECTED RADIO MUST RELEASE MISO</text>

  <!-- independent chip selects -->
  <text class="pin" x="516" y="517" text-anchor="end" fill="#d0bdff">NSS</text><circle cx="560" cy="510" r="7" fill="#b397ff"/>
  <path class="wioWire" d="M560 510H649"/><circle cx="649" cy="510" r="7" fill="#b397ff"/>
  <text class="pin" x="687" y="517" fill="#d0bdff">D4 / GPIO23</text>
  <text class="pin" x="1113" y="517" text-anchor="end" fill="#ffd37c">D3 / GPIO7</text><circle cx="1151" cy="510" r="7" fill="#f2ba55"/>
  <path class="ccWire" d="M1151 510H1240"/><circle cx="1240" cy="510" r="7" fill="#f2ba55"/>
  <text class="pin" x="1284" y="517" fill="#ffd37c">CSn</text>

  <!-- Wio-only control lines -->
  <g>
    <text class="pin" x="516" y="567" text-anchor="end">RST</text><circle cx="560" cy="560" r="7" fill="#b397ff"/><path class="wioWire" d="M560 560H649"/><circle cx="649" cy="560" r="7" fill="#b397ff"/><text class="pin" x="687" y="567">D0 / GPIO1</text>
    <text class="pin" x="516" y="617" text-anchor="end">DIO1</text><circle cx="560" cy="610" r="7" fill="#b397ff"/><path class="wioWire" d="M560 610H649"/><circle cx="649" cy="610" r="7" fill="#b397ff"/><text class="pin" x="687" y="617">D1 / GPIO0</text>
    <text class="pin" x="516" y="667" text-anchor="end">BUSY</text><circle cx="560" cy="660" r="7" fill="#b397ff"/><path class="wioWire" d="M560 660H649"/><circle cx="649" cy="660" r="7" fill="#b397ff"/><text class="pin" x="687" y="667">D5 / GPIO24</text>
    <text class="pin" x="516" y="717" text-anchor="end">RF_SW</text><circle cx="560" cy="710" r="7" fill="#b397ff"/><path class="wioWire" d="M560 710H649"/><circle cx="649" cy="710" r="7" fill="#b397ff"/><text class="pin" x="687" y="717">D2 / GPIO25</text>
  </g>

  <!-- CC1101 unconnected GDO -->
  <circle cx="1240" cy="575" r="7" fill="#f2ba55"/><text class="pin" x="1284" y="582">GDO0</text><path class="nc" d="M1382 575H1437"/><path d="M1437 567l12 8-12 8z" fill="#b7c6d9"/><text class="small" x="1462" y="582">NC · polling first</text>
  <circle cx="1240" cy="625" r="7" fill="#f2ba55"/><text class="pin" x="1284" y="632">GDO2</text><path class="nc" d="M1382 625H1437"/><path d="M1437 617l12 8-12 8z" fill="#b7c6d9"/><text class="small" x="1462" y="632">NC · leave open</text>
  <rect x="1300" y="671" width="382" height="42" rx="8" fill="#271e13" stroke="#866b3d"/>
  <text class="small" x="1491" y="698" text-anchor="middle">No reset wire · reset by SPI strobe</text>

  <!-- separate antenna endpoints -->
  <text class="net" x="91" y="773" fill="#d2c3ff">ANT</text><path class="wioWire" d="M135 767H205"/>
  <path d="M205 797V742M205 754l-26-27M205 754l26-27" fill="none" stroke="#b397ff" stroke-width="4" stroke-linecap="round"/>
  <text class="small" x="249" y="773">Dedicated 915 MHz antenna</text>
  <text class="net" x="1284" y="773" fill="#ffd37c">ANT</text><path class="ccWire" d="M1330 767H1400"/>
  <path d="M1400 797V742M1400 754l-26-27M1400 754l26-27" fill="none" stroke="#f2ba55" stroke-width="4" stroke-linecap="round"/>
  <text class="small" x="1444" y="773">Dedicated 915 MHz antenna</text>

  <!-- module grounds to common rail -->
  <circle cx="250" cy="830" r="7" fill="#63dcb0"/><path class="gnd" d="M250 830V1122"/><text class="net" x="268" y="817" fill="#7cebbd">GND</text>
  <circle cx="900" cy="830" r="7" fill="#63dcb0"/><path class="gnd" d="M900 830V1122"/><text class="net" x="920" y="817" fill="#7cebbd">GND</text>
  <circle cx="1550" cy="830" r="7" fill="#63dcb0"/><path class="gnd" d="M1550 830V1122"/><text class="net" x="1570" y="817" fill="#7cebbd">GND</text>

  <!-- Wio exact passive panel -->
  <rect class="passive" x="58" y="858" width="502" height="240" rx="18" stroke="#b397ff"/>
  <text x="82" y="887" font-size="18" font-weight="800" fill="#d5c9ff">WIO REQUIRED LOCAL PASSIVES</text>
  <text class="tiny" x="82" y="909">Independent branches · place capacitors at the module header.</text>
  <!-- C1 -->
  <text class="net" x="105" y="934" text-anchor="middle" fill="#7cebbd">3V3</text><path class="power" d="M105 941V955"/>
  <path class="cap" d="M92 958H118M92 968H118"/><path class="gnd" d="M105 968V1000"/>
  <path d="M90 1000h30m-24 7h18m-12 7h6" stroke="#63dcb0" stroke-width="3"/>
  <text class="value" x="105" y="1042" text-anchor="middle">C1</text><text class="tiny" x="105" y="1063" text-anchor="middle">100 nF</text>
  <!-- C2 -->
  <text class="net" x="195" y="934" text-anchor="middle" fill="#7cebbd">3V3</text><path class="power" d="M195 941V955"/>
  <path class="cap" d="M182 958H208M182 968H208"/><path class="gnd" d="M195 968V1000"/>
  <path d="M180 1000h30m-24 7h18m-12 7h6" stroke="#63dcb0" stroke-width="3"/>
  <text class="value" x="195" y="1042" text-anchor="middle">C2</text><text class="tiny" x="195" y="1063" text-anchor="middle">10 µF</text>
  <!-- R1 -->
  <text class="net" x="300" y="934" text-anchor="middle" fill="#7cebbd">3V3</text><path class="power" d="M300 941V950"/>
  <rect class="res" x="291" y="950" width="18" height="40"/><path class="wioWire" d="M300 990V1002"/>
  <rect class="labelBox" x="272" y="1002" width="56" height="24" rx="6" stroke="#b397ff"/><text class="net" x="300" y="1019" text-anchor="middle" fill="#d5c9ff">NSS</text>
  <text class="value" x="300" y="1052" text-anchor="middle">R1 · 10 kΩ</text><text class="tiny" x="300" y="1074" text-anchor="middle">PULL-UP</text>
  <!-- R2 -->
  <text class="net" x="400" y="934" text-anchor="middle" fill="#7cebbd">3V3</text><path class="power" d="M400 941V950"/>
  <rect class="res" x="391" y="950" width="18" height="40"/><path class="wioWire" d="M400 990V1002"/>
  <rect class="labelBox" x="369" y="1002" width="62" height="24" rx="6" stroke="#b397ff"/><text class="net" x="400" y="1019" text-anchor="middle" fill="#d5c9ff">RST</text>
  <text class="value" x="400" y="1052" text-anchor="middle">R2 · 10 kΩ</text><text class="tiny" x="400" y="1074" text-anchor="middle">PULL-UP</text>
  <!-- R3 -->
  <rect class="labelBox" x="463" y="927" width="74" height="24" rx="6" stroke="#b397ff"/><text class="net" x="500" y="944" text-anchor="middle" fill="#d5c9ff">RF_SW</text>
  <path class="wioWire" d="M500 951V958"/><rect class="res" x="491" y="958" width="18" height="40"/><path class="gnd" d="M500 998V1007"/>
  <path d="M485 1007h30m-24 7h18m-12 7h6" stroke="#63dcb0" stroke-width="3"/>
  <text class="value" x="500" y="1052" text-anchor="middle">R3 · 10 kΩ</text><text class="tiny" x="500" y="1074" text-anchor="middle">PULL-DOWN</text>

  <!-- center build notes -->
  <rect x="649" y="858" width="502" height="240" rx="18" fill="#0e2032" stroke="#4f7ba4" stroke-width="2"/>
  <text x="900" y="890" text-anchor="middle" font-size="18" font-weight="800">BUILD NOTES</text>
  <text class="small" x="681" y="922">• Start shared SPI at 1 MHz; keep the harness under 10 cm.</text>
  <text class="small" x="681" y="953">• Keep a nearby ground return alongside the SPI wires.</text>
  <text class="small" x="681" y="984">• Inspect modules for onboard passives; preserve each function.</text>
  <text class="small" x="681" y="1015">• Bench-check CC1101 MISO high-Z while CSn is high.</text>

  <!-- CC1101 exact passive panel -->
  <rect class="passive" x="1240" y="858" width="502" height="240" rx="18" stroke="#f2ba55"/>
  <text x="1264" y="887" font-size="18" font-weight="800" fill="#ffd37c">CC1101 REQUIRED LOCAL PASSIVES</text>
  <text class="tiny" x="1264" y="909">Independent branches · place capacitors close to VCC.</text>
  <!-- C3 -->
  <text class="net" x="1305" y="934" text-anchor="middle" fill="#7cebbd">VCC</text><path class="power" d="M1305 941V955"/>
  <path class="cap" d="M1292 958H1318M1292 968H1318"/><path class="gnd" d="M1305 968V1000"/>
  <path d="M1290 1000h30m-24 7h18m-12 7h6" stroke="#63dcb0" stroke-width="3"/>
  <text class="value" x="1305" y="1042" text-anchor="middle">C3</text><text class="tiny" x="1305" y="1063" text-anchor="middle">100 nF</text>
  <!-- C4 -->
  <text class="net" x="1430" y="934" text-anchor="middle" fill="#7cebbd">VCC</text><path class="power" d="M1430 941V955"/>
  <path class="cap" d="M1417 958H1443M1417 968H1443"/><path class="gnd" d="M1430 968V1000"/>
  <path d="M1415 1000h30m-24 7h18m-12 7h6" stroke="#63dcb0" stroke-width="3"/>
  <text class="value" x="1430" y="1042" text-anchor="middle">C4</text><text class="tiny" x="1430" y="1063" text-anchor="middle">10 µF</text>
  <!-- R4 -->
  <text class="net" x="1580" y="934" text-anchor="middle" fill="#7cebbd">3V3</text><path class="power" d="M1580 941V950"/>
  <rect class="res" x="1571" y="950" width="18" height="40"/><path class="ccWire" d="M1580 990V1002"/>
  <rect class="labelBox" x="1547" y="1002" width="66" height="24" rx="6" stroke="#f2ba55"/><text class="net" x="1580" y="1019" text-anchor="middle" fill="#ffd37c">CSn</text>
  <text class="value" x="1580" y="1052" text-anchor="middle">R4 · 10 kΩ</text><text class="tiny" x="1580" y="1074" text-anchor="middle">PULL-UP</text>
  <rect x="1640" y="930" width="76" height="90" rx="10" fill="#241c12" stroke="#806234"/>
  <text class="tiny" x="1678" y="955" text-anchor="middle">GDO0</text><text class="tiny" x="1678" y="976" text-anchor="middle">GDO2</text><text class="net" x="1678" y="1001" text-anchor="middle" fill="#ffd37c">OPEN</text>

  <!-- common ground rail -->
  <circle class="node" cx="250" cy="1122" r="7" fill="#63dcb0"/><circle class="node" cx="900" cy="1122" r="7" fill="#63dcb0"/><circle class="node" cx="1550" cy="1122" r="7" fill="#63dcb0"/>
  <path class="gnd" d="M125 1122H1742"/>
  <text class="head" x="58" y="1131" fill="#63dcb0">GND</text>

  <!-- warning and footer -->
  <rect x="58" y="1160" width="1684" height="72" rx="16" fill="#251925" stroke="#ff6977" stroke-width="3"/>
  <text class="warn" x="900" y="1203" text-anchor="middle" fill="#ff8390">SEPARATE ANTENNAS · NO PASSIVE RF SPLITTER · ONE ACTIVE RECEIVER AT A TIME</text>
  <text class="foot" x="900" y="1283" text-anchor="middle">PROTOTYPE WIRING · BENCH VALIDATION REQUIRED · GROVE 5 V DISCONNECTED AND INSULATED DURING BRING-UP</text>
</svg>
