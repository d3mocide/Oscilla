; bench-cc1101-s3 — NOT Oscilla. Known-good-driver RSSI reference for D-15.
; Receive-only sketch; see README.md.

[env:xiao-s3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
; v2.5.7: the long-standing release, used as the known-good reference.
lib_deps =
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git#v2.5.7
